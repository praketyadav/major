server:
  port: 8080

spring:
  application:
    name: recruitr-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**

        - id: drive-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/drives/**, /api/v1/questions/**

        - id: drive-ai-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/ai/**

        - id: enrollment-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/enrollment/**, /api/v1/eligibility/**

        - id: exam-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/exam/**, /api/v1/session/**

        - id: results-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/results/**, /api/v1/notifications/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

jwt:
  secret: "recruitrSuperSecretKeyForHS256AlgorithmThatIsAtLeast256BitsLong!!"
