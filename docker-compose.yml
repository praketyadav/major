version: '3.8'
services:

  mysql-auth:
    image: mysql:8.0
    container_name: recruitr_auth_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: recruitr_auth_db
    ports:
      - "3307:3306"
    volumes:
      - auth_data:/var/lib/mysql

  mysql-drive:
    image: mysql:8.0
    container_name: recruitr_drive_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: recruitr_drive_db
    ports:
      - "3308:3306"
    volumes:
      - drive_data:/var/lib/mysql

  mysql-enrollment:
    image: mysql:8.0
    container_name: recruitr_enrollment_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: recruitr_enrollment_db
    ports:
      - "3309:3306"
    volumes:
      - enrollment_data:/var/lib/mysql

  mysql-exam:
    image: mysql:8.0
    container_name: recruitr_exam_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: recruitr_exam_db
    ports:
      - "3310:3306"
    volumes:
      - exam_data:/var/lib/mysql

  mysql-results:
    image: mysql:8.0
    container_name: recruitr_results_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: recruitr_results_db
    ports:
      - "3311:3306"
    volumes:
      - results_data:/var/lib/mysql

volumes:
  auth_data:
  drive_data:
  enrollment_data:
  exam_data:
  results_data:
