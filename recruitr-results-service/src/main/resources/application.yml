server:
  port: 8085

spring:
  application:
    name: results-service
  datasource:
    url: jdbc:mysql://localhost:3311/recruitr_results_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

services:
  exam-url: http://localhost:8084
  drive-url: http://localhost:8082
  enrollment-url: http://localhost:8083
